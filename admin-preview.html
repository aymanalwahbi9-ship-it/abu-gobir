<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>معاينة الأعمال | أبو جبير</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:#f7f3ee}.readonly-shell{max-width:1180px;margin:auto;padding:42px 22px 80px}.readonly-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.readonly-head h1{margin:.35rem 0;font-size:clamp(2rem,5vw,3.5rem)}.readonly-note{color:#6d625b;line-height:1.9}.readonly-tools{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.readonly-tools input,.readonly-tools select{border:1px solid #d9cfc6;border-radius:999px;padding:13px 17px;background:white;font:inherit;min-width:210px}.readonly-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.readonly-card{overflow:hidden;border:1px solid #e5ddd5;border-radius:20px;background:white;box-shadow:0 10px 28px rgba(66,48,33,.06)}.readonly-card img{display:block;width:100%;height:205px;object-fit:cover}.readonly-card-body{padding:16px}.readonly-card h2{font-size:1.05rem;margin:0 0 8px}.readonly-card p{color:#756b64;line-height:1.7;margin:0;font-size:.9rem}.readonly-badge{display:inline-block;margin-bottom:10px;border-radius:999px;padding:5px 10px;background:#e7f3ea;color:#27633a;font-size:.78rem;font-weight:700}.readonly-empty{padding:30px;border-radius:18px;background:white;color:#756b64}.readonly-back{display:inline-flex;color:inherit;text-decoration:none;font-weight:700}.readonly-kicker{color:#ae7f38;font-weight:800}
  </style>
</head>
<body>
  <main class="readonly-shell">
    <a class="readonly-back" href="/">← العودة للموقع</a>
    <header class="readonly-head"><div><div class="readonly-kicker">لوحة معاينة</div><h1>أعمال أبو جبير</h1><p class="readonly-note">هذه نسخة عرض فقط لمراجعة الأعمال الحالية. الرفع والتعديل سيُفعّلان لاحقاً بعد تجهيز التخزين والحماية.</p></div></header>
    <div class="readonly-tools"><input id="search" type="search" placeholder="ابحث باسم العمل أو التصنيف"><select id="category"><option value="">كل التصنيفات</option></select></div>
    <p id="status" class="readonly-note">جاري تحميل الأعمال...</p>
    <section id="grid" class="readonly-grid" aria-live="polite"></section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
